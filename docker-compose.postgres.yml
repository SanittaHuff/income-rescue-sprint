services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: income_rescue_test
      POSTGRES_USER: income_rescue
      POSTGRES_PASSWORD: local_test_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U income_rescue -d income_rescue_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - income_rescue_pgdata:/var/lib/postgresql/data
volumes:
  income_rescue_pgdata:

name: Visible MVP Quality

on:
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'evidence-state-governance.js'
      - 'lvhq-family.css'
      - 'lvhq-family.js'
      - 'prototype-qa.js'
      - 'build-mode.css'
      - 'build-mode.js'
      - 'p0-tools.css'
      - 'p0-tools.js'
      - 'wave1-remediation.js'
      - 'P0-REVIEW-START-HERE.txt'
      - 'README.md'
      - 'docs/P0-COMPANION-IMPLEMENTATION-QA-CHECKPOINT.md'
      - 'docs/P0-HUMAN-REVIEW-GATE.md'
      - 'docs/P0-HUMAN-EVIDENCE-EXECUTION-RUNBOOK.md'
      - 'docs/RECRUITER-ATS-BASELINE-AND-P0-RETEST.md'
      - 'docs/P0-WAVE1-INTERNAL-PANEL-FINDINGS.md'
      - 'docs/P0-NEXT-BEST-ACTION-USER-CONTROL-CHECKPOINT.md'
      - 'scripts/validate-visible-mvp.mjs'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/visible-mvp-quality.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Validate visible MVP assets and truth boundaries
        run: npm run validate:mvp
      - name: Run governed browser QA
        run: npm run test:e2e
      - name: Preserve browser QA evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: p0-browser-qa-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish tested P0 human review build
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: p0-human-review-build
          path: |
            P0-REVIEW-START-HERE.txt
            index.html
            styles.css
            app.js
            evidence-state-governance.js
            lvhq-family.css
            lvhq-family.js
            prototype-qa.js
            build-mode.css
            build-mode.js
            p0-tools.css
            p0-tools.js
            wave1-remediation.js
            docs/P0-COMPANION-IMPLEMENTATION-QA-CHECKPOINT.md
            docs/P0-HUMAN-REVIEW-GATE.md
            docs/P0-HUMAN-EVIDENCE-EXECUTION-RUNBOOK.md
            docs/RECRUITER-ATS-BASELINE-AND-P0-RETEST.md
            docs/P0-WAVE1-INTERNAL-PANEL-FINDINGS.md
            docs/P0-NEXT-BEST-ACTION-USER-CONTROL-CHECKPOINT.md
          if-no-files-found: error
          retention-days: 30
name: Resume Product Release Gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resume-product-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci

      - name: Validate CI configuration
        run: npm run ci:preflight

      - name: Run complete offline release gate
        run: npm run verify:release

      - name: Generate production export
        run: npm run demo:export

      - name: Audit high-severity dependency findings
        run: npm audit --audit-level=high

      - name: Upload verified application artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resume-product-verified-build
          if-no-files-found: error
          retention-days: 30
          path: |
            primary-private-mvp-app.html
            private-mvp-production-resume.docx
            private-mvp-production-resume.pdf
            POSTGRES_PREFLIGHT_REPORT.json

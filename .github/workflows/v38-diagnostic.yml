name: V38 Release Gate Diagnostic

on:
  pull_request:
    branches: [v38-canonical]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency preflight
        run: npm run dependency:preflight

      - name: Typecheck
        run: npm run typecheck

      - name: Capture tests
        run: npm test > test-output.txt 2>&1

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v38-test-diagnostics
          if-no-files-found: error
          retention-days: 7
          path: test-output.txt

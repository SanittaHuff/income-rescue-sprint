name: V39 Dependency Audit Diagnostic

on:
  pull_request:
    branches: [v38-canonical]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Capture dependency audit
        run: npm audit --json > npm-audit.json || true

      - name: Upload dependency audit
        uses: actions/upload-artifact@v4
        with:
          name: v39-npm-audit
          if-no-files-found: error
          retention-days: 7
          path: npm-audit.json

# This diagnostic remains isolated from the canonical release workflow.
